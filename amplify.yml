version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
            - env | grep -E "^CRM_WEBHOOK_(URL|SECRET)=" > .env.production || true
        build:
          commands:
            - npm run build
        postBuild:
          commands:
            - rm -rf .next/cache
            - find .next -name "*.map" -delete
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
